name: Backend checks
on:
  push:
    paths: ["backend/**", "housecost/**", "frontend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "housecost/**", "frontend/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: housecost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: spaceforge
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: spaceforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spaceforge -d spaceforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://spaceforge:test_password@127.0.0.1:5432/spaceforge_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
