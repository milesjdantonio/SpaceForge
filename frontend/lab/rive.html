<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rive lab · TerraSim</title>
<style>
  :root { color-scheme: dark; --ground: #0a111c; --surface: #111b2a; --ink: #e8eef6; --muted: #9fb0c6; --line: #22324a; --amber: #ff8a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  header { padding: 20px 24px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header p { margin: 0; color: var(--muted); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; padding: 0 24px 24px; }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  h2 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  canvas { width: 100%; aspect-ratio: var(--ratio, 4 / 3); display: block; background: #08101a; border-radius: 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .controls label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
  button { background: #1b2a40; color: var(--ink); border: 1px solid #2c4060; border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--amber); }
  input[type=range] { accent-color: var(--amber); }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .status.error { color: #ff8f8f; }
</style>
</head>
<body>
<header>
  <h1>Rive lab</h1>
  <p>Every TerraSim .riv file with its animations and state-machine inputs. Add <code>?file=name</code> to show one.</p>
</header>
<main id="grid"></main>
<script src="../vendor/rive/rive.js"></script>
<script type="module">
  // Entries are "file" or "file:Artboard" for files with several artboards.
  const TYPES = ['House', 'Tiny', 'Townhouse', 'Duplex', 'Apartment', 'Condo', 'Dorm'].map((a) => `types:${a}`);
  const ALL = ['forge', 'mark', 'outline', 'pin', ...TYPES];
  const params = new URLSearchParams(location.search);
  const files = params.get('file') ? params.get('file').split(',').flatMap((f) => (f === 'types' ? TYPES : [f])) : ALL;
  window.__rive = {};
  rive.RuntimeLoader.setWasmUrl(new URL('../vendor/rive/rive.wasm', location.href).href);

  for (const entry of files) {
    const [name, artboard] = entry.split(':');
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${name}.riv${artboard ? ` · ${artboard}` : ''}</h2><canvas width="680" height="510"></canvas><div class="controls"></div><div class="status">Loading…</div>`;
    document.getElementById('grid').append(sec);
    const canvas = sec.querySelector('canvas');
    const status = sec.querySelector('.status');
    const controls = sec.querySelector('.controls');
    const report = { name: entry, loaded: false };
    window.__rive[entry] = report;
    rive.Rive.suppressDeprecationWarnings = ['default-state-machine', 'state-machine-inputs'];
    // First load reads the file's contents; if it has a state machine, it is remounted running it.
    const mount = (smName) => {
      const r = new rive.Rive({
        src: `../assets/rive/${name}.riv`,
        canvas,
        artboard,
        autoplay: true,
        stateMachines: smName,
        onLoad: () => {
          r.resizeDrawingSurfaceToCanvas();
          const contents = r.contents;
          const ab = contents?.artboards?.find((a) => !artboard || a.name === artboard) ?? contents?.artboards?.[0];
          report.artboard = ab?.name;
          report.animations = ab?.animations ?? [];
          report.stateMachines = (ab?.stateMachines ?? []).map((s) => ({ name: s.name, inputs: s.inputs }));
          const bounds = r.bounds;
          if (bounds) canvas.style.setProperty('--ratio', `${bounds.maxX - bounds.minX} / ${bounds.maxY - bounds.minY}`);
          const sm = report.stateMachines[0];
          if (sm && !smName && !params.get('anim')) {
            r.cleanup();
            mount(sm.name);
            return;
          }
          report.loaded = true;
          if (sm && smName) {
            const inputs = r.stateMachineInputs(sm.name) || [];
            for (const input of inputs) {
              const lab = document.createElement('label');
              if (input.type === rive.StateMachineInputType.Trigger) {
                const b = document.createElement('button');
                b.textContent = `fire ${input.name}`;
                b.onclick = () => input.fire();
                controls.append(b);
              } else if (input.type === rive.StateMachineInputType.Boolean) {
                lab.innerHTML = `<input type="checkbox"> ${input.name}`;
                lab.querySelector('input').onchange = (e) => { input.value = e.target.checked; };
                controls.append(lab);
              } else {
                const max = { stage: 5, state: 3, bearing: 360 }[input.name] ?? 100;
                lab.innerHTML = `${input.name} <input type="range" min="0" max="${max}" step="1" value="${input.value}">`;
                lab.querySelector('input').oninput = (e) => { input.value = Number(e.target.value); };
                controls.append(lab);
              }
            }
            report.inputs = inputs.map((i) => ({ name: i.name, type: i.type }));
          } else {
            for (const a of report.animations) {
              const b = document.createElement('button');
              b.textContent = `play ${a}`;
              b.onclick = () => { r.stop(); r.play(a); };
              controls.append(b);
            }
          }
          status.textContent = `${report.artboard}: ${report.animations.length} animations · ${report.stateMachines.map((s) => `${s.name} (${s.inputs.map((i) => i.name).join(', ')})`).join('; ') || 'no state machine'}`;
          window.__rive[entry].instance = r;
        },
        onLoadError: (e) => {
          report.error = String(e?.data ?? e);
          status.textContent = `Failed to load: ${report.error}`;
          status.classList.add('error');
        },
      });
    };
    try {
      mount(params.get('sm') || undefined);
    } catch (e) {
      report.error = String(e);
      status.textContent = `Failed: ${e}`;
      status.classList.add('error');
    }
  }
</script>
</body>
</html>
