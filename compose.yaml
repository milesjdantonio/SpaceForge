name: spaceforge
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: spaceforge
      POSTGRES_PASSWORD: spaceforge_local
      POSTGRES_DB: spaceforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceforge -d spaceforge"]
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    build: ./dev/auth
    ports:
      - "127.0.0.1:9099:9099"
    environment:
      CI: "true"
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9099/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
