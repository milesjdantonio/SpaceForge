<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TerraSim</title>
  <meta name="description" content="Find your land on the globe, outline it, and see the house TerraSim's design system draws for it, standing among everything around it.">
  <meta name="theme-color" content="#070b11">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/hanken-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/zodiak-300.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "maplibre-gl": "./vendor/maplibre/maplibre-gl.mjs"
      }
    }
  </script>
</head>
<body data-mode="globe">
  <canvas id="stars" class="stars" aria-hidden="true"></canvas>
  <div id="map" class="map" aria-label="Map"></div>

  <header class="bar" id="bar">
    <a class="brand" href="#/" aria-label="TerraSim, back to the globe">
      <span class="brand-mark" data-rive="mark" aria-hidden="true"></span>
      <span class="brand-name">TerraSim</span>
    </a>
    <form class="search" role="search" id="search" autocomplete="off">
      <label class="sr-only" for="search-q">Search for a place or address</label>
      <span class="search-icon" aria-hidden="true"></span>
      <input id="search-q" name="q" type="search" placeholder="Search a place or address" enterkeyhint="search" aria-controls="search-results" aria-expanded="false">
      <button type="button" class="search-clear" id="search-clear" aria-label="Clear search" title="Clear" hidden></button>
      <ul class="search-results" id="search-results" role="listbox" hidden></ul>
    </form>
    <nav class="bar-nav" aria-label="Main">
      <button type="button" class="bar-link" data-open="sites">My Builds</button>
      <button type="button" class="bar-link" data-open="catalog">Catalog</button>
      <button type="button" class="bar-link" id="account-button">Sign in</button>
    </nav>
    <button type="button" class="bar-help" id="help-button" aria-haspopup="dialog">How to</button>
    <div class="units" role="group" aria-label="Units">
      <button type="button" data-units="imperial" aria-pressed="true">ft</button>
      <button type="button" data-units="metric" aria-pressed="false">m</button>
    </div>
  </header>

  <main id="main">
    <section class="intro" id="intro" aria-labelledby="intro-title">
      <h1 class="intro-title" id="intro-title">TerraSim</h1>
      <div class="intro-start">
        <p class="start-label" id="start-label">Three ways to start</p>
        <ul class="start-options" aria-labelledby="start-label">
          <li><button type="button" class="start-option" data-start="marker" disabled>
            <span class="start-icon" data-icon="locate"></span>
            <span class="start-text"><strong data-start-title>Click your marker</strong><span data-start-note aria-live="polite">Finding your location…</span></span>
            <span class="start-tap" data-start-tap aria-hidden="true"></span>
          </button></li>
          <li class="start-or" aria-hidden="true">or</li>
          <li><div class="start-option" data-start="anywhere">
            <span class="start-icon" data-icon="pointer"></span>
            <span class="start-text"><strong data-start-title>Click anywhere</strong><span>Fly straight to that spot on the globe.</span></span>
          </div></li>
          <li class="start-or" aria-hidden="true">or</li>
          <li><div class="start-option" data-start="zoom">
            <span class="start-icon" data-icon="scroll"></span>
            <span class="start-text"><strong data-start-title>Scroll on the world</strong><span>Zoom in until you reach the ground.</span></span>
          </div></li>
        </ul>
      </div>
    </section>

    <p class="place-chip" id="place-chip" aria-live="polite" hidden></p>
    <div class="map-controls" id="map-controls" role="group" aria-label="Map view">
      <button type="button" class="ctl" data-ctl="in" aria-label="Zoom in" title="Zoom in"></button>
      <button type="button" class="ctl" data-ctl="out" aria-label="Zoom out" title="Zoom out"></button>
      <button type="button" class="ctl ctl-compass" data-ctl="north" aria-label="Face north" title="Face north, look straight down"><span class="compass-needle" aria-hidden="true"></span></button>
      <button type="button" class="ctl" data-ctl="globe" aria-label="Back to the globe" title="Back to the globe"></button>
    </div>

    <div class="toolbar" id="toolbar" hidden></div>
    <div class="draw-hint" id="draw-hint" hidden aria-live="polite"></div>
    <aside class="panel" id="panel" hidden aria-live="polite"></aside>
  </main>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog class="dialog" id="dialog"></dialog>
  <dialog class="dialog help-dialog" id="help"></dialog>
  <div class="walk" id="walk" hidden></div>

  <noscript><p class="noscript">TerraSim needs JavaScript for the map.</p></noscript>

  <script src="vendor/rive/rive.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
